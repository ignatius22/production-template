services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped

    env_file:
      - ./apps/api/.env

    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    name: atlas-network
