services:
  api:
    build:
      context: ./apps/api

    container_name: atlas-api

    ports:
      - "3000:3000"

    restart: unless-stopped

    env_file:
      - ./apps/api/.env

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    name: atlas-network